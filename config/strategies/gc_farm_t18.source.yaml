meta:
  name: gc_farm_t18
  family: gc_farm
  tier: 18
  version: 1

builder: gc_farm

runtime_policy:
  player_save_preflight: save_first

session_preflight_recovery:
  repair_mismatch_attempts: 3

initialization:
  target_priority:
    mode: enforce
    order:
      - Fleets
      - Boss
      - Elites
      - In Spotlight
      - Tank
      - Closest (Default)
      - Ranged
      - Protector
      - Fast
      - Basic
session_preflight:
  cards_deck: Farm
  card_recharge_modes:
    Demon Mode: auto_reactivate
    Nuke: ready_after_recharge
  workshop_preset: Farm
  bots_preset: Farm
  guardian_chips:
    - Fetch
    - Summon
    - Scout
  modules:
    cannon_assist: Being Annihilator
    cannon_primary: Amplifying Strike
    generator_primary: Black Hole Digestor
    generator_assist: Singularity Harness
    armor_assist: Anti-Cube Portal
    armor_primary: Orbital Augment
    core_primary: Multiverse Nexus
    core_assist: Dimension Core
  auto_pick_perks: true
  perk_first_choice: perk_wave_requirement
  perk_bans:
    - lifesteal_knockback_tradeoff
    - enemies_damage_tradeoff
    - defense_absolute
    - interest
    - land_mine_damage
    - cash_bonus
  perk_auto_pick_order:
    - perk_wave_requirement
    - game_speed
    - coin_tradeoff
    - golden_tower_bonus
    - black_hole_duration
    - death_wave_quantity
    - coins_bonus
    - free_upgrade_chance
    - orbs
    - damage
    - enemy_health_tradeoff
    - boss_health_tradeoff
    - enemy_speed_tradeoff
    - ranged_distance_tradeoff
    - tower_damage_boss_health_tradeoff
    - chain_lightning_damage
  ultimate_weapons:
    Chain Lightning:
      primary: on
    Smart Missiles:
      primary: on
    Death Wave:
      primary: on
    Chrono Field:
      primary: on
    Inner Land Mines:
      primary: on
    Golden Tower:
      primary: on
    Poison Swamp:
      primary: on
      stun: off
    Black Hole:
      primary: on
    Spotlight:
      primary: on
      missiles: on
