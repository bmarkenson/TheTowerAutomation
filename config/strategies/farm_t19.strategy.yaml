meta:
  name: farm_t19
  family: farm
  tier: 19
  version: 1
run_initialization:
  complete_when:
  - ehls_completed
  - eals_completed
  - target_priority_checked
  - damage_slider_checked
  - orb_distance_checked
session_preflight:
  complete_when:
  - gc_session_preflight_completed
  requirements:
    cards_deck: Farm
    card_recharge_modes:
      Demon Mode: auto_reactivate
      Nuke: ready_after_recharge
    workshop_preset: Farm
    free_upgrade_locks:
    - Shockwave Size
    - Bounce Shot Targets
    - Bounce Shot Range
    bots_preset: Farm
    guardian_chips:
    - Fetch
    - Summon
    - Scout
    auto_pick_perks: true
    perk_first_choice: perk_wave_requirement
    perk_bans:
    - lifesteal_knockback_tradeoff
    - enemies_damage_tradeoff
    - defense_absolute
    - interest
    - land_mine_damage
    - cash_bonus
    perk_auto_pick_order:
    - perk_wave_requirement
    - game_speed
    - coin_tradeoff
    - golden_tower_bonus
    - black_hole_duration
    - death_wave_quantity
    - coins_bonus
    - free_upgrade_chance
    - orbs
    - enemy_health_tradeoff
    - tower_damage_boss_health_tradeoff
    - enemy_speed_tradeoff
    - boss_health_tradeoff
    - ranged_distance_tradeoff
    - chain_lightning_damage
    - inner_land_mines
    - damage
    ultimate_weapons:
      Chain Lightning:
        primary: 'on'
      Smart Missiles:
        primary: 'on'
      Death Wave:
        primary: 'on'
      Chrono Field:
        primary: 'on'
      Inner Land Mines:
        primary: 'on'
      Golden Tower:
        primary: 'on'
      Poison Swamp:
        primary: 'on'
        stun: 'off'
      Black Hole:
        primary: 'on'
      Spotlight:
        primary: 'on'
        missiles: 'on'
    damage_slider:
      mode: enforce
      value: 1E-19%
    orb_distance:
      mode: enforce
      resolved:
        range_basis: 30.00m
        extra: 30.00m
        workshop: 39.00m
      range_presets:
      - range_basis: 30.00m
        extra: 30.00m
        workshop: 39.00m
      - range_basis: 98.38m
        extra: 80.37m
        workshop: 60.00m
    loadout_policies:
      modules: enforce
      target_priority: enforce
    modules:
      cannon_assist: Being Annihilator
      cannon_primary: Amplifying Strike
      generator_primary: Black Hole Digestor
      generator_assist: Singularity Harness
      armor_assist: Anti-Cube Portal
      armor_primary: Orbital Augment
      core_primary: Multiverse Nexus
      core_assist: Dimension Core
    target_priority:
    - Fast
    - Protector
    - Fleets
    - Boss
    - Elites
    - In Spotlight
    - Tank
    - Closest (Default)
    - Ranged
    - Basic
  fallbacks:
    bots_preset:
    - id: flame
      label: Continue with Flame for this run
      value: Flame
      description: Keep the currently selected Flame Bot preset and waive only the
        Farm Bot preset check.
  recovery:
    repair_mismatch_attempts: 3
vars:
  run_initialised: false
  fast_loop_active: false
  loop_sleep_override_sec: 0.0
  ehls_completed: false
  eals_completed: false
  last_upgrade_label: ''
  last_upgrade_reason: ''
  last_upgrade_sent: false
  last_upgrade_maxed_after: false
  last_upgrade_menu: ''
  last_upgrade_ts: 0
  maxed_enemy_health_level_skip: false
  maxed_enemy_attack_level_skip: false
  ehls_completion_wave: null
  eals_completion_wave: null
  eals_first_tap_wave: null
  eals_first_tap_elapsed_s: null
  level_skip_elapsed_s: 0.0
  level_skip_taps_sent: 0
  level_skip_last_reason: ''
  target_priority_checked: false
  damage_slider_checked: false
  damage_slider_observation: {}
  orb_distance_checked: false
  orb_distance_observation: {}
  gc_no_battle_setup_completed: false
  gc_no_battle_setup_degraded: false
  gc_no_battle_setup_failure: {}
  gc_no_battle_setup_evidence: {}
  gc_session_preflight_completed: false
  gc_session_preflight_attempted: false
  gc_session_preflight_degraded: false
  gc_session_preflight_disposition: ''
  gc_session_preflight_blocked: false
  gc_session_preflight_repair_required: false
  gc_session_preflight_repair_in_progress: false
  gc_session_preflight_last_status: ''
  gc_session_preflight_last_reason: ''
  gc_session_preflight_evidence: {}
  gc_session_preflight_failed_checks: []
  gc_session_preflight_waivers: {}
  gc_session_preflight_repair_attempts: 0
  gc_session_preflight_repair_failure_key: ''
per_run_reset:
- run_initialised
- fast_loop_active
- loop_sleep_override_sec
- ehls_completed
- eals_completed
- last_upgrade_label
- last_upgrade_reason
- last_upgrade_sent
- last_upgrade_maxed_after
- last_upgrade_menu
- last_upgrade_ts
- maxed_enemy_health_level_skip
- maxed_enemy_attack_level_skip
- ehls_completion_wave
- eals_completion_wave
- eals_first_tap_wave
- eals_first_tap_elapsed_s
- level_skip_elapsed_s
- level_skip_taps_sent
- level_skip_last_reason
- damage_slider_checked
- damage_slider_observation
- orb_distance_checked
- orb_distance_observation
rules:
- name: reset_on_game_over
  when:
    state: GAME_OVER
  do:
  - type: set
    var: run_initialised
    value: false
  - type: set
    var: fast_loop_active
    value: false
  - type: set
    var: loop_sleep_override_sec
    value: 0.0
  - type: set
    var: ehls_completed
    value: false
  - type: set
    var: eals_completed
    value: false
  - type: set
    var: maxed_enemy_health_level_skip
    value: false
  - type: set
    var: maxed_enemy_attack_level_skip
    value: false
  - type: set
    var: last_upgrade_label
    value: ''
  - type: set
    var: last_upgrade_reason
    value: ''
  - type: set
    var: last_upgrade_sent
    value: false
  - type: set
    var: last_upgrade_maxed_after
    value: false
  - type: set
    var: last_upgrade_menu
    value: ''
  - type: set
    var: last_upgrade_ts
    value: 0
  - type: set
    var: ehls_completion_wave
    value: null
  - type: set
    var: eals_completion_wave
    value: null
  - type: set
    var: eals_first_tap_wave
    value: null
  - type: set
    var: eals_first_tap_elapsed_s
    value: null
  - type: set
    var: level_skip_elapsed_s
    value: 0.0
  - type: set
    var: level_skip_taps_sent
    value: 0
  - type: set
    var: level_skip_last_reason
    value: ''
  - type: set
    var: damage_slider_checked
    value: false
  - type: set
    var: damage_slider_observation
    value: {}
  - type: set
    var: orb_distance_checked
    value: false
  - type: set
    var: orb_distance_observation
    value: {}
- name: initialise_fast_loop
  gate_phase: run_initialization
  when:
    state: RUNNING
  assert:
  - '!run_initialised'
  do:
  - type: set
    var: run_initialised
    value: true
  - type: set
    var: fast_loop_active
    value: true
  - type: set
    var: loop_sleep_override_sec
    value: 1.0
  - type: set
    var: ehls_completed
    value: false
  - type: set
    var: eals_completed
    value: false
  - type: set
    var: maxed_enemy_health_level_skip
    value: false
  - type: set
    var: maxed_enemy_attack_level_skip
    value: false
  - type: set
    var: last_upgrade_label
    value: ''
  - type: set
    var: last_upgrade_reason
    value: ''
  - type: set
    var: last_upgrade_sent
    value: false
  - type: set
    var: last_upgrade_maxed_after
    value: false
  - type: set
    var: last_upgrade_menu
    value: ''
  - type: set
    var: last_upgrade_ts
    value: 0
  - type: set
    var: ehls_completion_wave
    value: null
  - type: set
    var: eals_completion_wave
    value: null
  - type: set
    var: eals_first_tap_wave
    value: null
  - type: set
    var: eals_first_tap_elapsed_s
    value: null
  - type: set
    var: level_skip_elapsed_s
    value: 0.0
  - type: set
    var: level_skip_taps_sent
    value: 0
  - type: set
    var: level_skip_last_reason
    value: ''
  - type: set
    var: damage_slider_checked
    value: false
  - type: set
    var: damage_slider_observation
    value: {}
  - type: set
    var: orb_distance_checked
    value: false
  - type: set
    var: orb_distance_observation
    value: {}
- name: disable_fast_loop
  gate_phase: run_initialization
  when:
    state: RUNNING
  assert:
  - fast_loop_active
  - ehls_completed
  - eals_completed
  do:
  - type: set
    var: fast_loop_active
    value: false
  - type: set
    var: loop_sleep_override_sec
    value: 0.0
- name: initialize_level_skips_fast
  gate_phase: run_initialization
  when:
    state: RUNNING
  assert:
  - fast_loop_active
  - '!eals_completed'
  cooldown_sec: 0.25
  do:
  - type: level_skip_initialize
- name: enforce_damage_slider
  gate_phase: run_initialization
  when:
    state: RUNNING
  assert:
  - ehls_completed
  - eals_completed
  - '!damage_slider_checked'
  cooldown_sec: 30.0
  do:
  - type: damage_slider_configure
    mode: enforce
    value: 1E-19%
- name: enforce_orb_distance
  gate_phase: run_initialization
  when:
    state: RUNNING
  assert:
  - ehls_completed
  - eals_completed
  - '!orb_distance_checked'
  cooldown_sec: 30.0
  do:
  - type: orb_distance_configure
    mode: enforce
    range_basis: 30.00m
    extra: 30.00m
    workshop: 39.00m
    range_presets:
    - range_basis: 30.00m
      extra: 30.00m
      workshop: 39.00m
    - range_basis: 98.38m
      extra: 80.37m
      workshop: 60.00m
- name: ensure_target_priority
  gate_phase: run_initialization
  when:
    state: RUNNING
  assert:
  - ehls_completed
  - eals_completed
  - '!target_priority_checked'
  cooldown_sec: 30.0
  do:
  - type: target_priority_ensure
    order:
    - Fast
    - Protector
    - Fleets
    - Boss
    - Elites
    - In Spotlight
    - Tank
    - Closest (Default)
    - Ranged
    - Basic
- name: validate_gc_session_preflight
  gate_phase: session_preflight
  when:
    state: RUNNING
  assert:
  - ehls_completed
  - eals_completed
  - target_priority_checked
  - damage_slider_checked
  - orb_distance_checked
  - '!gc_session_preflight_completed'
