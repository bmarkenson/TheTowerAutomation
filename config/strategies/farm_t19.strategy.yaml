      - Summon
      - Scout
      auto_pick_perks: true
      perk_first_choice: perk_wave_requirement
      perk_bans:
      - lifesteal_knockback_tradeoff
      - enemies_damage_tradeoff
      - defense_absolute
      - interest
      - land_mine_damage
      - cash_bonus
      perk_auto_pick_order:
      - perk_wave_requirement
      - game_speed
      - coin_tradeoff
      - golden_tower_bonus
      - black_hole_duration
      - death_wave_quantity
      - coins_bonus
      - free_upgrade_chance
      - orbs
      - enemy_health_tradeoff
      - tower_damage_boss_health_tradeoff
      - enemy_speed_tradeoff
      - boss_health_tradeoff
      - ranged_distance_tradeoff
      - chain_lightning_damage
      - inner_land_mines
      - damage
      ultimate_weapons:
        Chain Lightning:
          primary: 'on'
        Smart Missiles:
          primary: 'on'
        Death Wave:
          primary: 'on'
        Chrono Field:
          primary: 'on'
        Inner Land Mines:
          primary: 'on'
        Golden Tower:
          primary: 'on'
        Poison Swamp:
          primary: 'on'
          stun: 'off'
        Black Hole:
          primary: 'on'
        Spotlight:
          primary: 'on'
          missiles: 'on'
      damage_slider:
        mode: enforce
        value: 1E-19%
      orb_distance:
        mode: enforce
        resolved:
          range_basis: 30.00m
          extra: 30.00m
          workshop: 39.00m
        range_presets:
        - range_basis: 30.00m
          extra: 30.00m
          workshop: 39.00m
        - range_basis: 98.38m
          extra: 80.37m
          workshop: 60.00m
      loadout_policies:
        modules: enforce
        target_priority: enforce
      modules:
        cannon_assist: Being Annihilator
