meta:
  name: gc_farm_t19_experiment
  family: gc_farm
  tier: 19
  experimental: true
  version: 1
run_initialization:
  complete_when:
  - ehls_completed
  - eals_completed
session_preflight:
  complete_when:
  - gc_session_preflight_completed
  requirements:
    cards_deck: Farm
    workshop_preset: Farm
    bots_preset: Farm
    guardian_chips:
    - Fetch
    - Summon
    - Scout
    modules:
      cannon_assist: Being Annihilator
      cannon_primary: Amplifying Strike
      generator_primary: Black Hole Digestor
      generator_assist: Singularity Harness
      armor_assist: Anti-Cube Portal
      armor_primary: Orbital Augment
      core_primary: Multiverse Nexus
      core_assist: Dimension Core
    auto_pick_perks: true
    ultimate_weapons:
      Chain Lightning:
        primary: 'on'
      Smart Missiles:
        primary: 'on'
      Death Wave:
        primary: 'on'
      Chrono Field:
        primary: 'on'
      Inner Land Mines:
        primary: 'on'
      Golden Tower:
        primary: 'on'
      Poison Swamp:
        primary: 'on'
        stun: 'off'
      Black Hole:
        primary: 'on'
      Spotlight:
        primary: 'on'
        missiles: 'on'
    loadout_policies:
      modules: enforce
vars:
  run_initialised: false
  fast_loop_active: false
  loop_sleep_override_sec: 0.0
  ehls_completed: false
  eals_completed: false
  last_upgrade_label: ''
  last_upgrade_reason: ''
  last_upgrade_sent: false
  last_upgrade_maxed_after: false
  last_upgrade_menu: ''
  last_upgrade_ts: 0
  maxed_enemy_health_level_skip: false
  maxed_enemy_attack_level_skip: false
  ehls_completion_wave: null
  eals_completion_wave: null
  eals_first_tap_wave: null
  eals_first_tap_elapsed_s: null
  level_skip_elapsed_s: 0.0
  level_skip_taps_sent: 0
  level_skip_last_reason: ''
  gc_no_battle_setup_completed: false
  gc_no_battle_setup_evidence: {}
  gc_session_preflight_completed: false
  gc_session_preflight_attempted: false
  gc_session_preflight_blocked: false
  gc_session_preflight_repair_required: false
  gc_session_preflight_repair_in_progress: false
  gc_session_preflight_last_status: ''
  gc_session_preflight_last_reason: ''
  gc_session_preflight_evidence: {}
per_run_reset:
- run_initialised
- fast_loop_active
- loop_sleep_override_sec
- ehls_completed
- eals_completed
- last_upgrade_label
- last_upgrade_reason
- last_upgrade_sent
- last_upgrade_maxed_after
- last_upgrade_menu
- last_upgrade_ts
- maxed_enemy_health_level_skip
- maxed_enemy_attack_level_skip
- ehls_completion_wave
- eals_completion_wave
- eals_first_tap_wave
- eals_first_tap_elapsed_s
- level_skip_elapsed_s
- level_skip_taps_sent
- level_skip_last_reason
rules:
- name: reset_on_game_over
  when:
    state: GAME_OVER
  do:
  - type: set
    var: run_initialised
    value: false
  - type: set
    var: fast_loop_active
    value: false
  - type: set
    var: loop_sleep_override_sec
    value: 0.0
  - type: set
    var: ehls_completed
    value: false
  - type: set
    var: eals_completed
    value: false
  - type: set
    var: maxed_enemy_health_level_skip
    value: false
  - type: set
    var: maxed_enemy_attack_level_skip
    value: false
  - type: set
    var: last_upgrade_label
    value: ''
  - type: set
    var: last_upgrade_reason
    value: ''
  - type: set
    var: last_upgrade_sent
    value: false
  - type: set
    var: last_upgrade_maxed_after
    value: false
  - type: set
    var: last_upgrade_menu
    value: ''
  - type: set
    var: last_upgrade_ts
    value: 0
  - type: set
    var: ehls_completion_wave
    value: null
  - type: set
    var: eals_completion_wave
    value: null
  - type: set
    var: eals_first_tap_wave
    value: null
  - type: set
    var: eals_first_tap_elapsed_s
    value: null
  - type: set
    var: level_skip_elapsed_s
    value: 0.0
  - type: set
    var: level_skip_taps_sent
    value: 0
  - type: set
    var: level_skip_last_reason
    value: ''
- name: initialise_fast_loop
  when:
    state: RUNNING
  assert:
  - '!run_initialised'
  do:
  - type: set
    var: run_initialised
    value: true
  - type: set
    var: fast_loop_active
    value: true
  - type: set
    var: loop_sleep_override_sec
    value: 1.0
  - type: set
    var: ehls_completed
    value: false
  - type: set
    var: eals_completed
    value: false
  - type: set
    var: maxed_enemy_health_level_skip
    value: false
  - type: set
    var: maxed_enemy_attack_level_skip
    value: false
  - type: set
    var: last_upgrade_label
    value: ''
  - type: set
    var: last_upgrade_reason
    value: ''
  - type: set
    var: last_upgrade_sent
    value: false
  - type: set
    var: last_upgrade_maxed_after
    value: false
  - type: set
    var: last_upgrade_menu
    value: ''
  - type: set
    var: last_upgrade_ts
    value: 0
  - type: set
    var: ehls_completion_wave
    value: null
  - type: set
    var: eals_completion_wave
    value: null
  - type: set
    var: eals_first_tap_wave
    value: null
  - type: set
    var: eals_first_tap_elapsed_s
    value: null
  - type: set
    var: level_skip_elapsed_s
    value: 0.0
  - type: set
    var: level_skip_taps_sent
    value: 0
  - type: set
    var: level_skip_last_reason
    value: ''
- name: disable_fast_loop
  when:
    state: RUNNING
  assert:
  - fast_loop_active
  - ehls_completed
  - eals_completed
  do:
  - type: set
    var: fast_loop_active
    value: false
  - type: set
    var: loop_sleep_override_sec
    value: 0.0
- name: initialize_level_skips_fast
  when:
    state: RUNNING
  assert:
  - fast_loop_active
  - '!eals_completed'
  cooldown_sec: 0.25
  do:
  - type: level_skip_initialize
- name: validate_gc_session_preflight
  when:
    state: RUNNING
  assert:
  - ehls_completed
  - eals_completed
  - '!gc_session_preflight_completed'
  - '!gc_session_preflight_attempted'
  cooldown_sec: 30.0
  do:
  - type: gc_session_preflight
    requirements:
      cards_deck: Farm
      workshop_preset: Farm
      bots_preset: Farm
      guardian_chips:
      - Fetch
      - Summon
      - Scout
      modules:
        cannon_assist: Being Annihilator
        cannon_primary: Amplifying Strike
        generator_primary: Black Hole Digestor
        generator_assist: Singularity Harness
        armor_assist: Anti-Cube Portal
        armor_primary: Orbital Augment
        core_primary: Multiverse Nexus
        core_assist: Dimension Core
      auto_pick_perks: true
      ultimate_weapons:
        Chain Lightning:
          primary: 'on'
        Smart Missiles:
          primary: 'on'
        Death Wave:
          primary: 'on'
        Chrono Field:
          primary: 'on'
        Inner Land Mines:
          primary: 'on'
        Golden Tower:
          primary: 'on'
        Poison Swamp:
          primary: 'on'
          stun: 'off'
        Black Hole:
          primary: 'on'
        Spotlight:
          primary: 'on'
          missiles: 'on'
      loadout_policies:
        modules: enforce
