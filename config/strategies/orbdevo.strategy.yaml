meta:
  name: orbdevo
  version: 1
vars:
  current_phase: early
  quantities_initialized: false
  completed: false
  ultimate_checked: false
  last_upgrade_label: ''
  last_upgrade_reason: ''
  last_upgrade_sent: false
  last_upgrade_maxed_after: false
  last_upgrade_menu: ''
  last_upgrade_ts: 0
  ultimate_targets: []
  stage_early: 0
  maxed_wall_health: false
  maxed_enemy_attack_level_skip: false
  maxed_enemy_health_level_skip: false
  maxed_rend_armor_chance: false
  maxed_rend_armor_mult: false
per_run_reset:
- completed
- last_upgrade_maxed_after
- last_upgrade_sent
- maxed_enemy_attack_level_skip
- maxed_enemy_health_level_skip
- maxed_rend_armor_chance
- maxed_rend_armor_mult
- maxed_wall_health
- quantities_initialized
- stage_early
- ultimate_checked
rules:
- name: game_over_reset
  when:
    state: GAME_OVER
  do:
  - type: set
    var: current_phase
    value: early
  - type: set
    var: quantities_initialized
    value: false
  - type: set
    var: completed
    value: false
  - type: set
    var: ultimate_checked
    value: false
  - type: set
    var: ultimate_targets
    value: []
  - type: set
    var: last_upgrade_label
    value: ''
  - type: set
    var: last_upgrade_reason
    value: ''
  - type: set
    var: last_upgrade_sent
    value: false
  - type: set
    var: last_upgrade_maxed_after
    value: false
  - type: set
    var: last_upgrade_menu
    value: ''
  - type: set
    var: last_upgrade_ts
    value: 0
  - type: set
    var: stage_early
    value: 0
  - type: set
    var: maxed_wall_health
    value: false
  - type: set
    var: maxed_enemy_attack_level_skip
    value: false
  - type: set
    var: maxed_enemy_health_level_skip
    value: false
  - type: set
    var: maxed_rend_armor_chance
    value: false
  - type: set
    var: maxed_rend_armor_mult
    value: false
- name: phase_select_early
  when:
    state: RUNNING
    assert:
    - '!completed'
    - current_phase != early
  do:
  - type: set
    var: current_phase
    value: early
  - type: set
    var: stage_early
    value: 0
  - type: set
    var: ultimate_checked
    value: false
  - type: set
    var: ultimate_targets
    value:
    - label: Chain Lightning
      toggles:
        primary: false
    - label: Death Wave
      toggles:
        primary: true
    - label: Inner Land Mines
      toggles:
        primary: false
    - label: Poison Swamp
      toggles:
        primary: false
    - label: Spotlight
      toggles:
        primary: true
        missiles: false
    - label: Smart Missiles
      toggles:
        primary: false
    - label: Chrono Field
      toggles:
        primary: true
    - label: Golden Tower
      toggles:
        primary: true
    - label: Black Hole
      toggles:
        primary: true
  - type: set
    var: last_upgrade_label
    value: ''
  - type: set
    var: last_upgrade_reason
    value: ''
  - type: set
    var: last_upgrade_sent
    value: false
  - type: set
    var: last_upgrade_maxed_after
    value: false
  - type: set
    var: last_upgrade_menu
    value: ''
  - type: set
    var: last_upgrade_ts
    value: 0
- name: init_buy_quantities
  when:
    state: RUNNING
    assert:
    - '!quantities_initialized'
    - '!completed'
  do:
  - type: upgrade_set_buy_quantities
    attack: max
    defense: max
    utility: max
  - type: set
    var: quantities_initialized
    value: true
- name: ensure_ultimate_on_early
  when:
    state: RUNNING
    assert:
    - '!completed'
    - current_phase == early
    - stage_early == 0
    - '!ultimate_checked'
  do:
  - type: ultimate_ensure_state
    targets:
    - label: Chain Lightning
      toggles:
        primary: false
    - label: Death Wave
      toggles:
        primary: true
    - label: Inner Land Mines
      toggles:
        primary: false
    - label: Poison Swamp
      toggles:
        primary: false
    - label: Spotlight
      toggles:
        primary: true
        missiles: false
    - label: Smart Missiles
      toggles:
        primary: false
    - label: Chrono Field
      toggles:
        primary: true
    - label: Golden Tower
      toggles:
        primary: true
    - label: Black Hole
      toggles:
        primary: true
  - type: set
    var: ultimate_checked
    value: true
- name: skip_early_00_wall_health_known
  when:
    state: RUNNING
    assert:
    - '!completed'
    - current_phase == early
    - stage_early == 0
    - maxed_wall_health
  do:
  - type: set
    var: stage_early
    value: 1
- name: skip_early_00_wall_health_detected
  when:
    state: RUNNING
    assert:
    - '!completed'
    - current_phase == early
    - stage_early == 0
    upgrade_maxed:
      menu: defense
      label: Wall Health
  do:
  - type: set
    var: maxed_wall_health
    value: true
  - type: set
    var: stage_early
    value: 1
  - type: set
    var: last_upgrade_label
    value: ''
  - type: set
    var: last_upgrade_reason
    value: ''
  - type: set
    var: last_upgrade_sent
    value: false
  - type: set
    var: last_upgrade_maxed_after
    value: false
  - type: set
    var: last_upgrade_menu
    value: ''
  - type: set
    var: last_upgrade_ts
    value: 0
- name: advance_early_00_wall_health_sent_maxed
  when:
    state: RUNNING
    assert:
    - '!completed'
    - current_phase == early
    - stage_early == 0
    - last_upgrade_label == Wall Health
    - last_upgrade_sent
    - last_upgrade_maxed_after
  do:
  - type: set
    var: maxed_wall_health
    value: true
  - type: set
    var: stage_early
    value: 1
  - type: set
    var: last_upgrade_label
    value: ''
  - type: set
    var: last_upgrade_reason
    value: ''
  - type: set
    var: last_upgrade_sent
    value: false
  - type: set
    var: last_upgrade_maxed_after
