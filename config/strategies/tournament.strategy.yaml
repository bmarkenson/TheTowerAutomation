meta:
  name: tournament
  family: tournament
  version: 1
runtime_policy:
  handlers:
  - ad_gem
  - game_over
  - game_speed
  auto_return: false
  game_over_mode: wait
  home_preflight: true
  session_preflight_on_attach: true
  preflight_mismatch: notify
  exclusive_validation:
    battle_kind: ordinary_new_battle
    timeout_seconds: 300
    ready_message: Tournament validation passed; waiting for operator confirmation
    failure_prefix: Tournament validation failed
    operator_launch:
      kind: tournament_battle
      timeout_seconds: 60
      prompt_title: Tournament validation passed
      prompt_message: Start the Tournament now? Automation will verify the current
        Home or Tournament entry screen and start exactly one Tournament battle.
      reminder: When the Tournament battle begins, set Target Priorities for the current
        Tournament Battle Conditions.
run_initialization:
  complete_when:
  - ehls_completed
  - eals_completed
session_preflight:
  complete_when:
  - damage_slider_checked
  - orb_distance_checked
  - gc_session_preflight_attempted
  requirements:
    cards_deck: Tournament
    workshop_preset: Tourney
    bots_preset: Amplify
    guardian_chips:
    - Attack
    - Ally
    - Scout
    ultimate_weapons:
      Chain Lightning:
        primary: 'on'
      Smart Missiles:
        primary: 'on'
      Death Wave:
        primary: 'on'
      Chrono Field:
        primary: 'on'
      Inner Land Mines:
        primary: 'on'
      Golden Tower:
        primary: 'on'
      Poison Swamp:
        primary: 'on'
        stun: 'on'
      Black Hole:
        primary: 'on'
      Spotlight:
        primary: 'on'
        missiles: 'on'
    loadout_policies:
      modules: enforce
    modules:
      cannon_assist: Being Annihilator
      cannon_primary: Amplifying Strike
      generator_primary: Project Funding
      generator_assist: Singularity Harness
      armor_assist: Anti-Cube Portal
      armor_primary: Orbital Augment
      core_primary: Dimension Core
      core_assist: Harmony Conductor
    damage_slider:
      mode: enforce
      value: 1E2%
    orb_distance:
      mode: enforce
      preset: tournament_range_98_38
      resolved:
        range_basis: 98.38m
        extra: 87.16m
        workshop: 80.37m
      range_presets:
      - range_basis: 30.00m
        extra: 30.00m
        workshop: 39.00m
      - range_basis: 98.38m
        extra: 87.16m
        workshop: 80.37m
vars:
  exclusive_validation_battle: false
  ehls_completed: false
  eals_completed: false
  maxed_enemy_health_level_skip: false
  maxed_enemy_attack_level_skip: false
  ehls_completion_wave: null
  eals_completion_wave: null
  eals_first_tap_wave: null
  eals_first_tap_elapsed_s: null
  level_skip_elapsed_s: 0.0
  level_skip_taps_sent: 0
  level_skip_last_reason: ''
  damage_slider_checked: false
  damage_slider_observation: {}
  orb_distance_checked: false
  orb_distance_observation: {}
  gc_session_preflight_completed: false
  gc_session_preflight_attempted: false
  gc_session_preflight_blocked: false
  gc_session_preflight_repair_required: false
  gc_session_preflight_repair_in_progress: false
  gc_session_preflight_last_status: ''
  gc_session_preflight_last_reason: ''
  gc_session_preflight_evidence: {}
  gc_session_preflight_advisory: false
per_run_reset:
- exclusive_validation_battle
- ehls_completed
- eals_completed
- maxed_enemy_health_level_skip
- maxed_enemy_attack_level_skip
- ehls_completion_wave
- eals_completion_wave
- eals_first_tap_wave
- eals_first_tap_elapsed_s
- level_skip_elapsed_s
- level_skip_taps_sent
- level_skip_last_reason
rules:
- name: initialize_tournament_level_skips
  gate_phase: run_initialization
  when:
    state: RUNNING
  assert:
  - '!exclusive_validation_battle'
  - '!eals_completed'
  cooldown_sec: 0.25
  do:
  - type: level_skip_initialize
- name: enforce_tournament_damage_slider
  gate_phase: session_preflight
  run_when_attached: true
  when:
    state: RUNNING
  assert:
  - '!damage_slider_checked'
  cooldown_sec: 30.0
  do:
  - type: damage_slider_configure
    mode: enforce
    value: 1E2%
- name: enforce_tournament_orb_distance
  gate_phase: session_preflight
  run_when_attached: true
  when:
    state: RUNNING
  assert:
  - damage_slider_checked
  - '!orb_distance_checked'
  cooldown_sec: 30.0
  do:
  - type: orb_distance_configure
    mode: enforce
    range_basis: 98.38m
    extra: 87.16m
    workshop: 80.37m
    range_presets:
    - range_basis: 30.00m
      extra: 30.00m
      workshop: 39.00m
    - range_basis: 98.38m
      extra: 87.16m
      workshop: 80.37m
- name: validate_tournament_session_preflight
  gate_phase: session_preflight
  run_when_attached: true
  when:
    state: RUNNING
  assert:
  - damage_slider_checked
  - orb_distance_checked
  - '!gc_session_preflight_attempted'
  cooldown_sec: 30.0
  do:
  - type: session_preflight
    validator: tournament
    allow_repair: false
    mismatch_policy: notify
    requirements:
      cards_deck: Tournament
      workshop_preset: Tourney
      bots_preset: Amplify
      guardian_chips:
      - Attack
      - Ally
      - Scout
      ultimate_weapons:
        Chain Lightning:
          primary: 'on'
        Smart Missiles:
          primary: 'on'
        Death Wave:
          primary: 'on'
        Chrono Field:
          primary: 'on'
        Inner Land Mines:
          primary: 'on'
        Golden Tower:
          primary: 'on'
        Poison Swamp:
          primary: 'on'
          stun: 'on'
        Black Hole:
          primary: 'on'
        Spotlight:
          primary: 'on'
          missiles: 'on'
      loadout_policies:
        modules: enforce
      modules:
        cannon_assist: Being Annihilator
        cannon_primary: Amplifying Strike
        generator_primary: Project Funding
        generator_assist: Singularity Harness
        armor_assist: Anti-Cube Portal
        armor_primary: Orbital Augment
        core_primary: Dimension Core
        core_assist: Harmony Conductor
      damage_slider:
        mode: enforce
        value: 1E2%
      orb_distance:
        mode: enforce
        preset: tournament_range_98_38
        resolved:
          range_basis: 98.38m
          extra: 87.16m
          workshop: 80.37m
        range_presets:
        - range_basis: 30.00m
          extra: 30.00m
          workshop: 39.00m
        - range_basis: 98.38m
          extra: 87.16m
          workshop: 80.37m
run_configuration:
  schema_version: 2
  profile: tournament
  profile_version: 1
  settings:
    cards_deck: Tournament
    workshop_preset: Tourney
    bots_preset: Amplify
    guardian_chips:
    - Attack
