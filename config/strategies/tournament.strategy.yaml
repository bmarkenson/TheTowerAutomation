meta:
  name: tournament
  family: tournament
  version: 1
runtime_policy:
  handlers:
  - ad_gem
  - game_over
  auto_return: false
  game_over_mode: wait
  home_preflight: true
  session_preflight_on_attach: true
  preflight_mismatch: notify
session_preflight:
  complete_when:
  - gc_session_preflight_attempted
  requirements:
    cards_deck: Tournament
    workshop_preset: Tourney
    bots_preset: Amplify
    guardian_chips:
    - Attack
    - Ally
    - Scout
    auto_pick_perks: false
    ultimate_weapons:
      Chain Lightning:
        primary: 'on'
      Smart Missiles:
        primary: 'on'
      Death Wave:
        primary: 'on'
      Chrono Field:
        primary: 'on'
      Inner Land Mines:
        primary: 'on'
      Golden Tower:
        primary: 'on'
      Poison Swamp:
        primary: 'on'
      Black Hole:
        primary: 'on'
      Spotlight:
        primary: 'on'
        missiles: 'on'
    loadout_policies:
      modules: enforce
    modules:
      cannon_assist: Being Annihilator
      cannon_primary: Amplifying Strike
      generator_primary: Project Funding
      generator_assist: Singularity Harness
      armor_assist: Anti-Cube Portal
      armor_primary: Orbital Augment
      core_primary: Dimension Core
      core_assist: Harmony Conductor
vars:
  gc_session_preflight_completed: false
  gc_session_preflight_attempted: false
  gc_session_preflight_blocked: false
  gc_session_preflight_repair_required: false
  gc_session_preflight_repair_in_progress: false
  gc_session_preflight_last_status: ''
  gc_session_preflight_last_reason: ''
  gc_session_preflight_evidence: {}
  gc_session_preflight_advisory: false
per_run_reset: []
rules:
- name: validate_tournament_session_preflight
  gate_phase: session_preflight
  run_when_attached: true
  when:
    state: RUNNING
  assert:
  - '!gc_session_preflight_attempted'
  cooldown_sec: 30.0
  do:
  - type: session_preflight
    validator: tournament
    allow_repair: false
    mismatch_policy: notify
    requirements:
      cards_deck: Tournament
      workshop_preset: Tourney
      bots_preset: Amplify
      guardian_chips:
      - Attack
      - Ally
      - Scout
      auto_pick_perks: false
      ultimate_weapons:
        Chain Lightning:
          primary: 'on'
        Smart Missiles:
          primary: 'on'
        Death Wave:
          primary: 'on'
        Chrono Field:
          primary: 'on'
        Inner Land Mines:
          primary: 'on'
        Golden Tower:
          primary: 'on'
        Poison Swamp:
          primary: 'on'
        Black Hole:
          primary: 'on'
        Spotlight:
          primary: 'on'
          missiles: 'on'
      loadout_policies:
        modules: enforce
      modules:
        cannon_assist: Being Annihilator
        cannon_primary: Amplifying Strike
        generator_primary: Project Funding
        generator_assist: Singularity Harness
        armor_assist: Anti-Cube Portal
        armor_primary: Orbital Augment
        core_primary: Dimension Core
        core_assist: Harmony Conductor
run_configuration:
  schema_version: 2
  profile: tournament
  profile_version: 1
  settings:
    cards_deck: Tournament
    workshop_preset: Tourney
    bots_preset: Amplify
    guardian_chips:
    - Attack
    - Ally
    - Scout
    auto_pick_perks: false
    ultimate_weapons:
      Chain Lightning:
        primary: 'on'
      Smart Missiles:
        primary: 'on'
      Death Wave:
        primary: 'on'
      Chrono Field:
        primary: 'on'
      Inner Land Mines:
        primary: 'on'
      Golden Tower:
        primary: 'on'
      Poison Swamp:
        primary: 'on'
      Black Hole:
        primary: 'on'
      Spotlight:
        primary: 'on'
        missiles: 'on'
  loadout:
    modules:
      mode: enforce
      preset: tournament_standard
      resolved:
        cannon_assist: Being Annihilator
        cannon_primary: Amplifying Strike
        generator_primary: Project Funding
        generator_assist: Singularity Harness
        armor_assist: Anti-Cube Portal
        armor_primary: Orbital Augment
        core_primary: Dimension Core
        core_assist: Harmony Conductor
  runtime_policy:
    handlers:
    - ad_gem
    - game_over
    auto_return: false
    game_over_mode: wait
    home_preflight: true
    session_preflight_on_attach: true
    preflight_mismatch: notify
