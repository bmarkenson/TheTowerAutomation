    - Scout
    ultimate_weapons:
      Chain Lightning:
        primary: 'on'
      Smart Missiles:
        primary: 'on'
      Death Wave:
        primary: 'on'
      Chrono Field:
        primary: 'on'
      Inner Land Mines:
        primary: 'on'
      Golden Tower:
        primary: 'on'
      Poison Swamp:
        primary: 'on'
        stun: 'on'
      Black Hole:
        primary: 'on'
      Spotlight:
        primary: 'on'
        missiles: 'on'
  loadout:
    modules:
      mode: enforce
      preset: tournament_standard
      resolved:
        cannon_assist: Being Annihilator
        cannon_primary: Amplifying Strike
        generator_primary: Project Funding
        generator_assist: Singularity Harness
        armor_assist: Anti-Cube Portal
        armor_primary: Orbital Augment
        core_primary: Dimension Core
        core_assist: Harmony Conductor
    damage_slider:
      mode: enforce
      value: 1E2%
    orb_distance:
      mode: enforce
      preset: tournament_range_98_38
      resolved:
        range_basis: 98.38m
        extra: 87.16m
        workshop: 80.37m
      range_presets:
      - range_basis: 30.00m
        extra: 30.00m
        workshop: 39.00m
      - range_basis: 98.38m
        extra: 87.16m
        workshop: 80.37m
  runtime_policy:
    handlers:
    - ad_gem
    - game_over
    - game_speed
    auto_return: false
    game_over_mode: wait
    home_preflight: true
