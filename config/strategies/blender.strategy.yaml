- name: phase_select_baseline
  when:
    state: RUNNING
    assert:
    - '!completed'
    - current_phase != baseline
  do:
  - type: set
    var: current_phase
    value: baseline
  - type: set
    var: stage_baseline
    value: 0
  - type: set
    var: ultimate_checked
    value: false
  - type: set
    var: ultimate_targets
    value: []
  - type: set
    var: last_upgrade_label
    value: ''
  - type: set
    var: last_upgrade_reason
    value: ''
  - type: set
    var: last_upgrade_sent
    value: false
  - type: set
    var: last_upgrade_maxed_after
    value: false
  - type: set
    var: last_upgrade_menu
    value: ''
  - type: set
    var: last_upgrade_ts
    value: 0
- name: init_buy_quantities
  when:
    state: RUNNING
    assert:
    - '!quantities_initialized'
    - '!completed'
  do:
  - type: upgrade_set_buy_quantities
    attack: max
    defense: max
    utility: max
  - type: set
    var: quantities_initialized
    value: true
- name: ensure_ultimate_on_baseline
  when:
    state: RUNNING
    assert:
    - '!completed'
    - current_phase == baseline
    - stage_baseline == 0
    - '!ultimate_checked'
  do:
  - type: ultimate_ensure_state
    targets: []
  - type: set
    var: ultimate_checked
    value: true
- name: skip_baseline_00_free_utility_upgrade_known
  when:
    state: RUNNING
    assert:
    - '!completed'
    - current_phase == baseline
    - stage_baseline == 0
    - maxed_free_utility_upgrade
  do:
