meta:
  name: gc_farm_t18
  family: gc_farm
  tier: 18
  version: 1
run_initialization:
  complete_when:
  - ehls_completed
  - eals_completed
  - target_priority_checked
vars:
  run_initialised: false
  fast_loop_active: false
  loop_sleep_override_sec: 0.0
  ehls_completed: false
  eals_completed: false
  last_upgrade_label: ''
  last_upgrade_reason: ''
  last_upgrade_sent: false
  last_upgrade_maxed_after: false
  last_upgrade_menu: ''
  last_upgrade_ts: 0
  maxed_enemy_health_level_skip: false
  maxed_enemy_attack_level_skip: false
  ehls_completion_wave: null
  eals_completion_wave: null
  eals_first_tap_wave: null
  eals_first_tap_elapsed_s: null
  level_skip_elapsed_s: 0.0
  level_skip_taps_sent: 0
  level_skip_last_reason: ''
  target_priority_checked: false
per_run_reset:
- run_initialised
- fast_loop_active
- loop_sleep_override_sec
- ehls_completed
- eals_completed
- last_upgrade_label
- last_upgrade_reason
- last_upgrade_sent
- last_upgrade_maxed_after
- last_upgrade_menu
- last_upgrade_ts
- maxed_enemy_health_level_skip
- maxed_enemy_attack_level_skip
- ehls_completion_wave
- eals_completion_wave
- eals_first_tap_wave
- eals_first_tap_elapsed_s
- level_skip_elapsed_s
- level_skip_taps_sent
- level_skip_last_reason
rules:
- name: reset_on_game_over
  when:
    state: GAME_OVER
  do:
  - type: set
    var: run_initialised
    value: false
  - type: set
    var: fast_loop_active
    value: false
  - type: set
    var: loop_sleep_override_sec
    value: 0.0
  - type: set
    var: ehls_completed
    value: false
  - type: set
    var: eals_completed
    value: false
  - type: set
    var: maxed_enemy_health_level_skip
    value: false
  - type: set
    var: maxed_enemy_attack_level_skip
    value: false
  - type: set
    var: last_upgrade_label
    value: ''
  - type: set
    var: last_upgrade_reason
    value: ''
  - type: set
    var: last_upgrade_sent
    value: false
  - type: set
    var: last_upgrade_maxed_after
    value: false
  - type: set
    var: last_upgrade_menu
    value: ''
  - type: set
    var: last_upgrade_ts
    value: 0
  - type: set
    var: ehls_completion_wave
    value: null
  - type: set
    var: eals_completion_wave
    value: null
  - type: set
    var: eals_first_tap_wave
    value: null
  - type: set
    var: eals_first_tap_elapsed_s
    value: null
  - type: set
    var: level_skip_elapsed_s
    value: 0.0
  - type: set
    var: level_skip_taps_sent
    value: 0
  - type: set
    var: level_skip_last_reason
    value: ''
- name: initialise_fast_loop
  when:
    state: RUNNING
  assert:
  - '!run_initialised'
  do:
  - type: set
    var: run_initialised
    value: true
  - type: set
    var: fast_loop_active
    value: true
  - type: set
    var: loop_sleep_override_sec
    value: 1.0
  - type: set
    var: ehls_completed
    value: false
  - type: set
    var: eals_completed
    value: false
  - type: set
    var: maxed_enemy_health_level_skip
    value: false
  - type: set
    var: maxed_enemy_attack_level_skip
    value: false
  - type: set
    var: last_upgrade_label
    value: ''
  - type: set
    var: last_upgrade_reason
    value: ''
  - type: set
    var: last_upgrade_sent
    value: false
  - type: set
    var: last_upgrade_maxed_after
    value: false
  - type: set
    var: last_upgrade_menu
    value: ''
  - type: set
    var: last_upgrade_ts
    value: 0
  - type: set
    var: ehls_completion_wave
    value: null
  - type: set
    var: eals_completion_wave
    value: null
  - type: set
    var: eals_first_tap_wave
    value: null
  - type: set
    var: eals_first_tap_elapsed_s
    value: null
  - type: set
    var: level_skip_elapsed_s
    value: 0.0
  - type: set
    var: level_skip_taps_sent
    value: 0
  - type: set
    var: level_skip_last_reason
    value: ''
- name: disable_fast_loop
  when:
    state: RUNNING
  assert:
  - fast_loop_active
  - ehls_completed
  - eals_completed
  do:
  - type: set
    var: fast_loop_active
    value: false
  - type: set
    var: loop_sleep_override_sec
    value: 0.0
- name: initialize_level_skips_fast
  when:
    state: RUNNING
  assert:
  - fast_loop_active
  - '!eals_completed'
  cooldown_sec: 0.25
  do:
  - type: level_skip_initialize
- name: ensure_target_priority
  when:
    state: RUNNING
  assert:
  - ehls_completed
  - eals_completed
  - '!target_priority_checked'
  cooldown_sec: 30.0
  do:
  - type: target_priority_ensure
    order:
    - Fleets
    - Boss
    - Elites
    - In Spotlight
    - Tank
    - Closest (Default)
    - Ranged
    - Protector
    - Fast
    - Basic
