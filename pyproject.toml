[project]
name = "thetower"
version = "0.0.0"
description = "TheTower automation repository dependency contract"
requires-python = "==3.12.*"
dependencies = [
    "numpy==2.2.6",
    "opencv-python==4.12.0.88",
    "Pillow==11.3.0",
    "pytesseract==0.3.13",
    "PyYAML==6.0.2",
]

[project.optional-dependencies]
player-save = [
    "nrbf==0.1.2",
]
developer-tools = [
    "keyboard==0.13.5",
    "pynput==1.8.1",
]
test = [
    "pytest==8.4.2",
]

[tool.setuptools]
packages = []
