#:schema https://developers.openai.com/codex/config-schema.json

# TheTower talks to the established host ADB server over loopback.
default_permissions = "thetower"

[permissions.thetower]
description = "TheTower workspace access with localhost ADB connectivity."
extends = ":workspace"

[permissions.thetower.network]
enabled = true

[permissions.thetower.network.domains]
"localhost" = "allow"
"127.0.0.1" = "allow"
